modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
mixins = [{config = "noflyzone.mixins.json"}]

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
logoFile = "assets/noflyzone/icon.png"
description = """
Give a beacon the No-Fly effect and elytra stop working inside its range.
Enforcement is entirely server-side, but mod can be installed on client
for UI improvement to set up the beacon in-game.
"""

[[dependencies.noflyzone]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version_min},27)"
ordering = "NONE"
side = "BOTH"

[[dependencies.noflyzone]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version_min},27)"
ordering = "NONE"
side = "BOTH"
